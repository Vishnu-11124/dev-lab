services:
  nginx:
    image: nginx
    container_name: microservice_nginx
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  gateway1:
    build: ./backend/gateway
    ports:
      - "7001:8000" 
    env_file:
      - ./backend/gateway/.env  
    environment:
      - GATEWAY_NAME="api gateway one"  
    container_name: api_gateway_one

  gateway2:
    build: ./backend/gateway
    ports:
      - "7002:8000" 
    env_file:
      - ./backend/gateway/.env 
    environment:
      - GATEWAY_NAME="api gateway two"  
    container_name: api_gateway_two  

  auth-service:
    build: ./backend/services/auth
    ports:
      - "6001:8001"  
    env_file:
      - ./backend/services/auth/.env  

  product-service:
    build: ./backend/services/product
    ports:
      - "6003:8003"  
    env_file:
      - ./backend/services/product/.env 

  order-service:
    build: ./backend/services/order
    ports:
      - "6002:8002"  
    env_file:
      - ./backend/services/order/.env          
  
   
    