services:
  nginx:
    image: nginx
    container_name: demo_nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  server:
    build: ./server
    ports:
      - "5000:7000" 
    env_file:
      - ./server/.env  
    container_name: demo_server
  
       